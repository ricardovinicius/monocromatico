name: Build & Export Godot Game

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Grant permission to write to the repository (required for releases if you add that later)
permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1 # UPDATE THIS to your specific version!
  PROJECT_PATH: .    # Change this if your project.godot is in a subfolder

jobs:
  export_game:
    name: Export Game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Game with Godot
        id: export_godot
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: ${{ format('https://downloads.godotengine.org/?version={0}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64', env.GODOT_VERSION) }}
          godot_export_templates_download_url: ${{ format('https://downloads.godotengine.org/?version={0}&flavor=stable&slug=export_templates.tpz&platform=templates', env.GODOT_VERSION) }}
          relative_project_path: ${{ env.PROJECT_PATH }}
          archive_output: true
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: ${{ steps.export_godot.outputs.archive_directory }}/*