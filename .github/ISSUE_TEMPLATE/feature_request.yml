name: 🚀 Feature Request
description: Suggest an idea for this project
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check if this request has already been reported before submitting.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What part of the game does this affect?
      options:
        - Gameplay / Mechanics
        - UI / UX
        - Art / Animation
        - Audio
        - Networking
        - Editor / Tools
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when I try to organize my inventory because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: Add a 'Sort by Type' button in the inventory screen...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or workarounds have you considered?
    validations:
      required: false